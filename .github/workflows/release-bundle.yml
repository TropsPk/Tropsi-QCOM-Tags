name: Release QCOM tag bundle

# One tag in -> all core sm8250 repos at that tag -> one GitHub Release.
# history = true  (default): each repo keeps its FULL git history (.git inside the archive,
#                            tag checked out) -> extract, then git log / git fetch / git merge.
# history = false          : plain source snapshot, no git history (smaller, for diff / copy).
# Each archive is uploaded as one file (no splitting). A size check fails loudly above 2 GiB.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "CLO tag to release"
        required: true
        default: "LA.UM.9.12.r1-18500-SMxx50.QSSI14.0"
      history:
        description: "Keep full git history in each archive"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TAG: ${{ inputs.tag }}
      HISTORY: ${{ inputs.history }}
      GH_TOKEN: ${{ github.token }}
      # name|url  (verified reachable by the research workflow)
      REPOS: |
        msm-4.19|https://git.codelinaro.org/clo/la/kernel/msm-4.19
        audio-kernel|https://git.codelinaro.org/clo/la/platform/vendor/opensource/audio-kernel
        camera-kernel|https://git.codelinaro.org/clo/la/platform/vendor/opensource/camera-kernel
        video-driver|https://git.codelinaro.org/clo/la/platform/vendor/opensource/video-driver
        display-drivers|https://git.codelinaro.org/clo/la/platform/vendor/opensource/display-drivers
        data-kernel|https://git.codelinaro.org/clo/la/platform/vendor/qcom-opensource/data-kernel
        qcacld-3.0|https://git.codelinaro.org/clo/la/platform/vendor/qcom-opensource/wlan/qcacld-3.0
        qca-wifi-host-cmn|https://git.codelinaro.org/clo/la/platform/vendor/qcom-opensource/wlan/qca-wifi-host-cmn
        fw-api|https://git.codelinaro.org/clo/la/platform/vendor/qcom-opensource/wlan/fw-api
    steps:
      - name: Fetch repos and publish release
        run: |
          set -uo pipefail
          case "$TAG" in ""|*[!A-Za-z0-9._+-]*) echo "Bad tag: $TAG"; exit 1;; esac
          command -v zstd >/dev/null || sudo apt-get install -y zstd >/dev/null
          export GIT_TERMINAL_PROMPT=0
          LIMIT=2147483648   # GitHub release asset limit (2 GiB)
          if [ "${CI:-}" = "true" ]; then   # free runner disk for big histories
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          fi
          mkdir -p out work
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "$HISTORY" = "true" ]; then mode="full git history"; else mode="snapshot, no history"; fi
          { echo "### Tag \`$TAG\` ($mode)"; echo; echo "| repo | result | commit | commits | size |"; echo "|---|---|---|---|---|"; } >> "$summary"
          : > out/SOURCES.txt

          rel_ready=0
          ensure_release() {   # create the release once, on the first upload
            [ "$rel_ready" -eq 1 ] && return 0
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
                --notes "CodeLinaro tag $TAG ($mode) - upload in progress" || return 1
            fi
            rel_ready=1
          }
          up() {   # upload one file with retries
            local f="$1" a
            ensure_release || return 1
            for a in 1 2 3; do
              gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY" && return 0
              echo "upload attempt $a failed for $f"; sleep $((a * 30))
            done
            return 1
          }

          ok=0; fail=0
          while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            git ls-remote --exit-code --tags --refs "$url" "refs/tags/$TAG" >/dev/null 2>&1
            rc=$?
            if [ $rc -eq 2 ]; then
              echo "::warning::$name has no tag $TAG - skipped"
              echo "| $name | tag not found, skipped | | | |" >> "$summary"; continue
            elif [ $rc -ne 0 ]; then
              echo "::error::$name unreachable"
              echo "| $name | ERROR unreachable | | | |" >> "$summary"; fail=$((fail+1)); continue
            fi

            cloned=0
            for attempt in 1 2 3; do
              rm -rf "work/$name"
              if [ "$HISTORY" = "true" ]; then
                # full history reachable from the tag, only that tag (no other branches/tags)
                git init -q "work/$name" \
                  && git -C "work/$name" fetch --no-tags --quiet "$url" "+refs/tags/$TAG:refs/tags/$TAG" \
                  && git -C "work/$name" checkout -q --detach "refs/tags/$TAG" \
                  && git -C "work/$name" remote add origin "$url" && { cloned=1; break; }
              else
                git clone --quiet --depth 1 --branch "$TAG" "$url" "work/$name" && { cloned=1; break; }
              fi
              echo "fetch attempt $attempt failed for $name"; sleep $((attempt * 15))
            done
            if [ "$cloned" -ne 1 ]; then
              echo "::error::$name fetch failed after 3 tries"
              echo "| $name | ERROR fetch failed | | | |" >> "$summary"; fail=$((fail+1)); rm -rf "work/$name"; continue
            fi

            sha=$(git -C "work/$name" rev-parse HEAD)
            if [ "$HISTORY" = "true" ]; then
              asset="$name-$TAG.git.tar.zst"; level=6      # packs are already compressed, -19 only wastes time
              commits=$(git -C "work/$name" rev-list --count HEAD)
            else
              rm -rf "work/$name/.git"
              asset="$name-$TAG.tar.zst"; level=9       # lossless; 9 is much faster than 19 for little size gain
              commits="-"
            fi

            if ! tar -C work -I "zstd -$level -T0" -cf "out/$asset" "$name" || ! zstd -tq "out/$asset"; then
              echo "::error::$name pack failed"
              echo "| $name | ERROR pack failed | \`${sha:0:12}\` | $commits | |" >> "$summary"
              fail=$((fail+1)); rm -rf "work/$name" "out/$asset"; continue
            fi
            rm -rf "work/$name"

            bytes=$(stat -c%s "out/$asset"); size=$(du -h "out/$asset" | cut -f1)
            if [ "$bytes" -ge "$LIMIT" ]; then
              echo "::error::$name archive is $size - over the 2 GiB GitHub limit, not uploaded"
              echo "| $name | ERROR over 2 GiB | \`${sha:0:12}\` | $commits | $size |" >> "$summary"
              fail=$((fail+1)); rm -f "out/$asset"; continue
            fi

            if ! up "out/$asset"; then
              echo "::error::$name upload failed"
              echo "| $name | ERROR upload failed | \`${sha:0:12}\` | $commits | $size |" >> "$summary"
              fail=$((fail+1)); rm -f "out/$asset"; continue
            fi
            rm -f "out/$asset"
            echo "$name | $url | $TAG | $sha | $asset ($size) | commits=$commits" >> out/SOURCES.txt
            echo "| $name | ok | \`${sha:0:12}\` | $commits | $size |" >> "$summary"
            ok=$((ok+1))
          done <<< "$REPOS"

          if [ "$ok" -eq 0 ]; then echo "Nothing to release"; exit 1; fi

          {
            if [ "$HISTORY" = "true" ]; then
              echo "Full git history of CodeLinaro tag \`$TAG\` (tag checked out, .git included)."
              echo
              echo "How to use:"
              echo "  tar -I zstd -xf NAME-$TAG.git.tar.zst   # then: cd NAME && git log"
              echo "  or inside your own repo: git fetch /path/to/NAME refs/tags/$TAG:refs/tags/$TAG"
            else
              echo "Source snapshots (no git history) of CodeLinaro tag \`$TAG\`."
            fi
            echo
            echo "Included repos: $ok. Exact commits are in SOURCES.txt."
          } > notes.md
          up out/SOURCES.txt
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          [ "$fail" -eq 0 ] || { echo "$fail repo(s) failed"; exit 1; }
